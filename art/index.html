<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>最后一场鹅鸭杀 · 画册</title>
<style>
  :root{
    --bg:#F0EFEB; --txt:#58402E;
    --mut:rgba(88,64,46,.60); --lab:rgba(88,64,46,.72);
    --faint:rgba(88,64,46,.40); --quiet:rgba(88,64,46,.15); --grid:rgba(88,64,46,.16);
    --data:#43593B; --data2:#77835A; --hero:#D4A017; --wheat:#F2D17E;
    --slab:'Roboto Slab','Noto Serif SC',serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);
    font-family:'Roboto Slab','Noto Serif SC','PingFang SC','Microsoft YaHei',serif;
    -webkit-font-smoothing:antialiased;display:flex;justify-content:center;padding:56px 24px}
  .sheet{width:1080px;max-width:1080px}
  .mast{display:flex;align-items:end;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .kicker{font-size:12px;font-weight:600;letter-spacing:.22em;color:var(--mut)}
  h1{font-size:52px;font-weight:900;line-height:1.05;text-shadow:3px 3px 0 rgba(172,173,121,.45);margin-top:6px}
  .back{font-size:12px;color:var(--lab);text-decoration:none;border-bottom:1px solid var(--grid);padding-bottom:2px}
  .back:hover{color:var(--data)}
  .rule{border-top:1px solid var(--txt);margin-top:18px}
  .lede{font-size:14px;line-height:1.9;color:var(--lab);max-width:640px;margin-top:22px}
  .lede b{color:var(--data)}
  .sec-title{margin-top:44px;font-size:13px;font-weight:700;letter-spacing:.18em;color:var(--mut);
    display:flex;align-items:center;gap:10px}
  .sec-title .n{background:var(--data);color:var(--bg);width:20px;height:20px;display:inline-flex;
    align-items:center;justify-content:center;font-size:11px;flex:none}
  .covers{display:grid;grid-template-columns:4fr 3fr;gap:26px;margin-top:18px;align-items:start}
  figure{margin:0}
  .ph{position:relative;background:var(--quiet) center no-repeat;border-radius:6px;overflow:hidden;
    box-shadow:0 10px 34px rgba(88,64,46,.18);display:block;width:100%}
  .ph::before{content:"…";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--faint);font-size:34px;letter-spacing:.2em}
  .ph img{position:relative;width:100%;height:auto;display:block}
  figcaption{margin-top:10px}
  figcaption .t{font-size:14px;font-weight:700;color:var(--data)}
  figcaption .t em{font-style:normal;color:var(--hero)}
  figcaption .d{font-size:11px;color:var(--lab);margin-top:3px;line-height:1.7}
  .wall{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:18px;align-items:start}
  .card{background:#F7F5EF;border:1px solid var(--grid);border-radius:6px;overflow:hidden;cursor:zoom-in;
    transition:transform .18s ease,box-shadow .18s ease}
  .card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(88,64,46,.16)}
  .card .ph{border-radius:0;box-shadow:none;aspect-ratio:var(--ar,1)}
  .card .ph::before{font-size:20px}
  .card .ph img{height:100%;object-fit:cover;position:absolute}
  .card .cap{padding:12px 14px 14px}
  .card .t{font-size:13.5px;font-weight:700;color:var(--data)}
  .card .t em{font-style:normal;color:var(--hero)}
  .card .d{font-size:10.5px;color:var(--lab);line-height:1.75;margin-top:4px}
  /* 全屏查看器 */
  .viewer{position:fixed;inset:0;background:rgba(31,30,28,.94);display:none;
    flex-direction:column;align-items:center;justify-content:center;z-index:50;padding:18px}
  .viewer.on{display:flex}
  .viewer img{max-width:100%;max-height:78vh;border-radius:4px;background:var(--quiet);min-height:120px;min-width:120px}
  .viewer .vbar{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap;justify-content:center}
  .viewer .vt{color:var(--wheat);font-size:15px;font-weight:700}
  .viewer .vd{color:rgba(240,239,235,.75);font-size:11px;margin-top:4px;text-align:center;max-width:640px;line-height:1.7}
  .viewer button{background:var(--data);color:var(--bg);border:0;border-radius:20px;padding:7px 18px;
    font:inherit;font-size:12px;font-weight:700;cursor:pointer}
  .viewer .x{position:absolute;top:14px;right:14px;background:rgba(240,239,235,.14);color:#F0EFEB}
  .viewer .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(240,239,235,.12);
    color:#F0EFEB;font-size:22px;padding:10px 14px;border-radius:50%}
  .viewer .prev{left:10px}.viewer .next{right:10px}
  .foot{margin-top:52px;padding-top:12px;border-top:1px solid var(--txt);
    display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
    font-size:9.5px;font-weight:600;letter-spacing:.14em;color:var(--mut)}
  .privacy{margin-top:22px;border:1px dashed var(--faint);padding:10px 14px;
    font-size:10px;color:var(--lab);letter-spacing:.04em}
  @media(max-width:900px){
    body{padding:28px 14px}
    .sheet{width:100%;max-width:100%}
    h1{font-size:36px}
    .covers{grid-template-columns:1fr}
    .wall{grid-template-columns:repeat(2,1fr);gap:12px}
    .card .cap{padding:9px 11px 11px}
    .viewer img{max-height:64vh}
  }
  @media(max-width:520px){.wall{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="sheet">
  <div class="mast">
    <div>
      <div class="kicker">画册 · THE ART EDITION</div>
      <h1>最后一场鹅鸭杀 · 画册</h1>
      <div class="rule"></div>
    </div>
    <a class="back" href="../">← 返回正篇报告</a>
  </div>

  <p class="lede">由 gpt-image-2.5 依 90 天聊天记录绘成的 <b>20 张画</b>：
    两张封面，十八张名场面。每张画对应一个群里真实发生过的事——
    名字即人物，标题即剧情。<b>点任意一张可放大</b>（大图首次打开需数秒加载）。</p>

  <div class="sec-title"><span class="n">封</span>封面 · 两款</div>
  <div class="covers">
    <figure>
      <span class="ph" data-i="0"><img src="img/cover-main.jpg" loading="lazy" decoding="async" alt="杂志封面"></span>
      <figcaption><div class="t">杂志封面 · <em>拍立得墙</em></div>
        <div class="d">15 位主要发言人的拍立得，一张空了一半的圆桌——「不同的角色，相同的朋友」。</div>
      </figcaption>
    </figure>
    <figure>
      <span class="ph" data-i="1"><img src="img/cover-poster.jpg" loading="lazy" decoding="async" alt="电影海报"></span>
      <figcaption><div class="t">电影海报 · <em>鹅鸭村夜色</em></div>
        <div class="d">深秋夜路的最后一局，五位主演定妆照，路牌写着：更远的地方 / 还是朋友 / 一路向前。</div>
      </figcaption>
    </figure>
  </div>

  <div class="sec-title"><span class="n">场</span>名场面 · 十八张（点图放大）</div>
  <div class="wall" id="wall"></div>

  <div class="privacy">⚠ 画中角色形象由群友头像与聊天记录演绎生成，仅供群内留念，请勿外传。</div>

  <div class="foot">
    <span>最后一场鹅鸭杀 · 画册 · 2026-07-07 → 10-07</span>
    <span>GPT-IMAGE-2.5 · 20 张 · 画与记</span>
  </div>
</div>

<div class="viewer" id="viewer">
  <button class="x" onclick="closeV()">关闭 ✕</button>
  <button class="nav prev" onclick="step(-1)">‹</button>
  <img id="vimg" alt="">
  <div class="vbar">
    <span class="vt" id="vt"></span>
    <button onclick="step(1)">下一张 →</button>
  </div>
  <div class="vd" id="vd"></div>
</div>

<script>
/* 数据：en 文件名 / 标题 / 一句话 / 缩略图宽高（占位防塌陷） */
const ART=[
 ["cover-main","杂志封面 · 拍立得墙","15 位主要发言人的拍立得，一张空了一半的圆桌——「不同的角色，相同的朋友」。",1120,1400],
 ["cover-poster","电影海报 · 鹅鸭村夜色","深秋夜路的最后一局，五位主演定妆照，路牌：更远的地方 / 还是朋友 / 一路向前。",933,1400],
 ["01-xia12","下12！","深夜 23:58，一句号令与一块屏幕的光。",1248,832],
 ["02-shenglv","胜率公审","三张 50% 的截图，一场没人劝架的庭审。",1248,832],
 ["03-manfen","满分男评分会","「但是他打游戏菜菜的，几分？」——6 分，及格。",1024,1024],
 ["04-jingmo","8-15 静默日","93 天里唯一的零条，尘埃落在屏幕上。",1024,1024],
 ["05-toucai","偷菜战争","零点的菜地，月光下抱菜狂奔的那一只。",1280,720],
 ["06-maogou","猫狗夜谈","254 条消息：小猫的屁屁、油条、和「我的猫像我」。",1248,832],
 ["07-bingxian","兵线悬案","袋子里是兵线，放大镜后是全群——被告自封罪名服役一个月。",1248,832],
 ["08-jinju","金句代打","打字机后是本尊，签字的是「bot」。",1024,1024],
 ["09-ha24","24 连哈","一条消息里最长的笑，全季纪录。",896,1120],
 ["10-gonglve","1814 字攻略","《墨子：零基础 3 天冲万战》——本群最长单条。",1248,832],
 ["11-doutu","斗图烟花","第 86 场斗图，28 张图的夜空，胜率公审那天。",1400,781],
 ["12-shouye","守夜人","00:00-06:00 的深夜观察站，占全季消息 11.4%。",1400,781],
 ["13-errenzhuan","二人转","花花子 ↔ xxxxxxxJ，1794 次接话的世界巡演。",1400,1400],
 ["14-rili","入秋日历","九月开始，叶子一片片变浅——6,537 到 189。",1045,1400],
 ["15-zhantai","离场站台","四张背影车票，没有告别仪式。",1400,1400],
 ["16-zuihou","最后的笑","片尾字幕：「早知道我不说话了」。",1400,1400],
 ["17-yinhang","拍一拍银行","本季货币结算：功德 -96，余额 +4,400,000。",1400,781],
 ["18-jinisi","群吉尼斯","24 连哈 / 1814 字 / 38 小时，颁奖台合影。",1400,781]
];
/* 缩略图墙（不包含两张封面） */
const wall=document.getElementById('wall');
wall.innerHTML=ART.slice(2).map((a,i)=>{
  const idx=i+2, ar=(a[3]/a[4]).toFixed(4);
  return `<div class="card" onclick="openV(${idx})">`
    +`<span class="ph" style="--ar:${ar}"><img loading="lazy" decoding="async" src="thumbs/${a[0]}.jpg" alt=""></span>`
    +`<div class="cap"><div class="t">${a[1]}</div><div class="d">${a[2]}</div></div></div>`;
}).join('');
/* 封面也可点开 */
document.querySelectorAll('.covers .ph').forEach(sp=>{
  sp.addEventListener('click',()=>openV(+sp.dataset.i));
  sp.style.cursor='zoom-in';
});
/* 全屏查看器 */
let cur=-1;
const viewer=document.getElementById('viewer'),vimg=document.getElementById('vimg');
function openV(i){
  cur=i; const a=ART[i];
  vimg.style.opacity='0';
  vimg.src='img/'+a[0]+'.jpg';
  vimg.onload=()=>{vimg.style.opacity='1'};
  document.getElementById('vt').textContent=a[1]+' · '+(i+1)+'/'+ART.length;
  document.getElementById('vd').textContent=a[2];
  viewer.classList.add('on');
  document.body.style.overflow='hidden';
}
function closeV(){viewer.classList.remove('on');document.body.style.overflow='';vimg.src=''}
function step(d){openV((cur+d+ART.length)%ART.length)}
viewer.addEventListener('click',e=>{if(e.target===viewer)closeV()});
document.addEventListener('keydown',e=>{
  if(!viewer.classList.contains('on'))return;
  if(e.key==='Escape')closeV();
  if(e.key==='ArrowRight')step(1);
  if(e.key==='ArrowLeft')step(-1);
});
</script>
</body>
</html>
